[advisories]
# Each ignored advisory must also be tracked in the GitHub tracking issue for
# upstream-blocked RUSTSEC advisories. When an upstream fix ships (e.g. Tauri
# migrates wry to webkit6gtk, or a transitive dep bumps a nom/rand version),
# remove the entry and let CI flag any regression.
ignore = [
    # --- gtk-rs GTK3 bindings, unmaintained. Transitive via
    # tauri -> wry -> webkit2gtk / gtk 0.18. Blocked on Tauri/wry migrating
    # off GTK3; there is no GTK3 fork we can swap in.
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0429", # glib::VariantStrIter unsoundness (gtk-rs family)

    # --- transitive unmaintained deps pulled in by upstream crates
    "RUSTSEC-2024-0370", # proc-macro-error, via multiple build-time macro crates
    "RUSTSEC-2025-0075", # unic-char-range, via idna_adapter
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident

    # --- soundness in transitive deps, not exploitable in our threat model
    "RUSTSEC-2023-0086", # lexical-core 0.7.6, via imap 2.x -> nom 5. The
                        # unsound float parser is not reached by IMAP parsing
                        # (no floats). A future migration to imap 3.x would
                        # drop this transitively.

    # --- cryptographic timing side-channel, no upstream fix available
    "RUSTSEC-2023-0071", # rsa "Marvin Attack": potential RSA key recovery
                        # through a timing side-channel. Transitive via the
                        # OpenPGP stack (libtumpa -> rpgp -> rsa). No
                        # constant-time `rsa` release exists yet. The attack
                        # needs an adversary to time many RSA private-key
                        # operations, in practice over a network; Chithi
                        # decrypts locally on explicit user action and
                        # exposes no network-reachable RSA oracle, so the
                        # practical exposure is minimal. Drop this once
                        # `rsa` ships a constant-time release.
                        # Upstream: https://github.com/RustCrypto/RSA/issues/19

    # --- quick-xml < 0.41 DoS on untrusted XML, both copies transitive via
    # the Tauri toolchain and un-bumpable without a new Tauri release:
    #   quick-xml 0.39.4 <- plist <- tauri-utils (config / macOS bundling)
    #   quick-xml 0.37.5 <- tauri-winrt-notification <- notify-rust
    #                       <- tauri-plugin-notification (Windows toasts)
    # 0.41 is a semver-major bump the parents pin below; Tauri 2.11.2 is
    # the latest 2.x, so there is no compatible bump for us to take.
    # Neither path parses attacker-supplied XML in Chithi (local Info.plist
    # / self-generated toast XML), so the DoS is not reachable in our
    # threat model. Drop when a Tauri release moves plist / notify-rust to
    # a quick-xml 0.41 line.
    "RUSTSEC-2026-0194", # quick-xml quadratic dup-attribute check (CPU DoS)
    "RUSTSEC-2026-0195", # quick-xml unbounded namespace-decl alloc (mem DoS)
]
