# Build the chithi.org documentation site on every push and pull
# request, deploy to GitHub Pages on push to main. Building on
# every push (not just doc-touching ones) catches link rot and
# config drift introduced by source-only PRs that happen to break
# the build, and lets feature branches verify their docs even
# when they don't ship to production yet.
#
# The repo's Pages settings need "Source: GitHub Actions" and
# the custom domain `chithi.org` configured (DNS apex A records
# point at GitHub's Pages IPs).

name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't kick off two deploys at once — let the latest commit win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade mkdocs-material
      # `--strict` turns broken links / missing nav entries into
      # build failures so a doc-rot PR fails CI before deploy.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only deploy on push to main. Feature branches and PRs
    # build-only as a guard against doc rot.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
