site_name: Chithi
site_url: https://chithi.org
site_description: A privacy-focused desktop email, calendar, and contacts client.
site_author: Chithi authors
copyright: Copyright &copy; 2026 Chithi authors

repo_url: https://github.com/SUNET/chithi
repo_name: SUNET/chithi
edit_uri: edit/main/web/

# Public website source lives under `web/`, kept separate from the
# in-repo `docs/` (features overview + ADRs) which is for project
# contributors and does not get published to chithi.org.
docs_dir: web

# `web/CNAME` and the static OAuth bounce under
# `web/oauth/zoom/index.html` are not part of the navigation but
# need to round-trip through the build untouched. mkdocs copies
# unrecognised files in the docs source verbatim; this entry
# silences the "not in nav" warnings the strict CI build would
# otherwise emit.
not_in_nav: |
  /CNAME
  /oauth/**

theme:
  name: material
  language: en
  palette:
    # Match the warm-amber chrome the desktop app uses (ADR 0043).
    - scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Letting mkdocs auto-derive the nav from the `web/` tree keeps
# new pages picked up without bookkeeping. Top-level pages render
# as tabs; nested directories (user/, admin/) become sections.
